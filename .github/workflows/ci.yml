name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intentionally scoped for runtime budget in early-stage repo.
        os: [ubuntu-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Formatting check
        run: cargo fmt --check

      - name: Type check
        run: cargo check

      - name: WASM library check (no default features)
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test suite
        run: cargo test

      # The default build has no network client (bd-t1r); push/pull and tests/push_pull.rs only
      # exist with the `network` feature, so lint and test that configuration too.
      - name: Clippy, network feature (deny warnings)
        run: cargo clippy --all-targets --features network -- -D warnings

      - name: Test suite, network feature
        run: cargo test --features network

      - name: Default build has no HTTP/TLS crates
        run: |
          if cargo tree --edges normal | grep -Ei 'ureq|rustls|hyper|reqwest|native-tls'; then
            echo "network crates are in the default dependency graph" >&2
            exit 1
          fi

      - name: Local reproduction commands
        if: failure()
        run: |
          echo "CI failed. Reproduce locally with:"
          echo "cargo fmt --check"
          echo "cargo check"
          echo "cargo clippy --all-targets -- -D warnings"
          echo "cargo test"
          {
            echo "### Local reproduction"
            echo '```bash'
            echo "cargo fmt --check"
            echo "cargo check"
            echo "cargo clippy --all-targets -- -D warnings"
            echo "cargo test"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
