[package]
name = "profile"
version = "0.13.0"
edition = "2024"
description = "Creates, validates, and freezes column-scoping profiles for report tools"
license = "MIT"
repository = "https://github.com/cmdrvl/profile"

[dependencies]
blake3 = "1.8.2"
chrono = { version = "0.4.40", default-features = false, features = ["serde", "std"], optional = true }
clap = { version = "4.5.32", features = ["derive"], optional = true }
csv = "1.3.1"
# JSONL / Parquet / XLSX inputs (CSV and TSV keep profile's own reader). Pinned by commit.
cmdrvl-tabular = { git = "https://github.com/cmdrvl/tabular", rev = "e83afb0ebe848a58c888cf619b105cbad19852e6", optional = true }
encoding_rs = "0.8.35"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
# Keyed HMAC-SHA256 header markers (bd-ds5): same crates/versions as rvl and fingerprint.
hmac = "0.12.1"
sha2 = "0.10.8"
# Network push/pull (deferred data-fabric commands): opt-in via the `network` feature, off by
# default so the default binary has no HTTP/TLS crates (bd-t1r).
ureq = { version = "2.12.1", features = ["json"], optional = true }

[features]
default = ["cli", "tabular", "zstd"]
cli = ["dep:clap", "std-clock"]
tabular = ["dep:cmdrvl-tabular"]
zstd = ["cmdrvl-tabular?/zstd"]
std-clock = ["dep:chrono", "chrono/clock"]
network = ["dep:ureq"]

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.18.0"
tiny_http = "0.12.0"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
